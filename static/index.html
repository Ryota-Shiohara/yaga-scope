<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>本部 Live Transcript</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-row">
          <div>
            <p class="eyebrow">YAGAMI FESTIVAL · HQ</p>
            <h1>本部 Live Transcript</h1>
          </div>
          <div
            id="connection-badge"
            class="connection-badge"
            data-state="connecting"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <span id="connection-label">接続中</span>
          </div>
        </div>

        <section class="system-status" aria-label="システム状態">
          <div class="status-item" id="mic-status" data-state="initializing">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-name">Mic</span>
            <span class="status-value">準備中</span>
          </div>
          <div class="status-item" id="vad-status" data-state="initializing">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-name">VAD</span>
            <span class="status-value">準備中</span>
          </div>
          <div class="status-item" id="asr-status" data-state="initializing">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="status-name">ASR</span>
            <span class="status-value">準備中</span>
          </div>
        </section>
      </header>

      <main id="transcript-container" class="transcript-container">
        <div id="transcript-list" class="transcript-list" role="log" aria-live="polite">
          <section id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 1 0 6 0V6a3 3 0 0 0-3-3Z" />
              <path d="M5.5 11.5V12a6.5 6.5 0 0 0 13 0v-.5M12 18.5V22M8.5 22h7" />
            </svg>
            <h2>音声を待っています</h2>
            <p>認識された発話がここに時刻順で表示されます。</p>
          </section>
        </div>
      </main>

      <button id="jump-latest" class="jump-latest" type="button" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
        最新の発話へ
      </button>

      <footer class="footer-bar">
        <p>閲覧専用 · この画面を閉じると表示内容は残りません</p>
        <p id="transcript-count" aria-live="polite">発話 0件</p>
      </footer>
    </div>
  </body>
</html>

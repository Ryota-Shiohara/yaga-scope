[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yagami-hq-live-transcript"
version = "0.1.0"
description = "矢上祭本部向けのLAN内リアルタイム日本語文字起こしシステム"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "faster-whisper>=1.1,<2",
  "numpy>=1.26,<3",
  "pydantic-settings>=2.5,<3",
  "silero-vad>=6,<7",
  "sounddevice>=0.5,<1",
  "torch>=2.2,<3",
  "tzdata>=2024.1; platform_system == 'Windows'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]

[project.scripts]
yaga-transcribe-console = "app.console:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
